# Paperless-ngx application stack.
#
# Requires postgres to already be running on this host —
# this stack connects to it over the external `postgres_net` network rather
# than running its own database.
#
# Data layout: everything paperless owns lives under
# /media/nextcdata/paperless/ on the host: data, media, export, import.
#
# Backup: the `backup` sidecar wakes up nightly, asks paperless to refresh
# its document-exporter snapshot in export/, then pushes that snapshot to
# your Hetzner Storage Box with borg (see backup.sh).
#
# Health: the same sidecar serves a JSON health endpoint on port 1337.
# After every successful run backup.sh stamps /health/last-backup with the
# current date; the endpoint reports UP while that file is fresh.
#
# Doxie: the `doxie` sidecar periodically checks your Doxie scanner for new
# scans, downloads them into paperless' consume folder and then deletes them
# from the scanner. Scanner address and poll interval come from the .env file
# (DOXIE_IP, DOXIE_POLL_INTERVAL, optional DOXIE_PASSWORD).
#
# ONE-TIME SETUP before first start:
#   1. mkdir -p /media/nextcdata/paperless/{data,media,export,import}
#   2. Generate a dedicated backup key and add its PUBLIC half to your
#      Storage Box's authorized SSH keys (Hetzner Robot panel, or
#      `ssh-copy-id -p 23 <user>@<user>.your-storagebox.de`):
#        mkdir -p secrets
#        ssh-keygen -t ed25519 -f secrets/borg_ssh_key -N ""
#   3. Create a paperless.env file next to this compose file with:
#        BORG_REPO=ssh://u123456@u123456.your-storagebox.de:23/./paperless
#        BORG_PASSPHRASE=<a strong passphrase — write it down somewhere safe,
#                          losing it means losing access to the backups>
#   4. Make sure PAPERLESS_DBPASS below matches postgres creds.
#   5. After first `docker compose up -d`, test the backup once manually:
#        docker exec paperless-backup /usr/local/bin/backup
#
# Note: the `backup` sidecar is given the Docker socket so it can `docker
# exec` into the paperless container. That's effectively root-equivalent
# access to the host — standard for this kind of maintenance sidecar, but
# worth knowing.

services:
  broker:
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-webserver
    restart: unless-stopped
    depends_on:
      - broker
      - gotenberg
      - tika
    networks:
      - default
      - postgres_net
    ports:
      - "8000:8000"
    volumes:
      - /media/nextcdata/paperless/data:/usr/src/paperless/data
      - /media/nextcdata/paperless/media:/usr/src/paperless/media
      - /media/nextcdata/paperless/export:/usr/src/paperless/export
      - /media/nextcdata/paperless/import:/usr/src/paperless/consume
    environment:
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_OCR_LANGUAGE: deu
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: shared-postgres
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBUSER: ${PAPERLESS_DBUSER}
      PAPERLESS_DBPASS: ${PAPERLESS_DBPASS}
      PAPERLESS_DBNAME: paperless
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      USERMAP_UID: 999
      USERMAP_GID: 995

  gotenberg:
    image: docker.io/gotenberg/gotenberg:latest
    restart: unless-stopped
    # The gotenberg chromium route is used to convert .eml files. We do not
    # want to allow external content like tracking pixels or even javascript.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
  tika:
    image: docker.io/apache/tika:latest
    restart: unless-stopped

  doxie:
    image: alpine:3.22
    container_name: paperless-doxie
    restart: unless-stopped
    depends_on:
      - webserver
    volumes:
      - /media/nextcdata/paperless/import:/consume
      - ./doxie-client.sh:/doxie-client.sh:ro
    environment:
      TZ: Europe/Berlin
      CONSUME_DIR: /consume
      CONSUME_OWNER: ${CONSUME_OWNER:-999:995}
      DOXIE_IP: ${DOXIE_IP:-10.10.100.1}
      DOXIE_POLL_INTERVAL: ${DOXIE_POLL_INTERVAL:-300}
      DOXIE_PASSWORD: ${DOXIE_PASSWORD:-}
      DOXIE_TIMEOUT: ${DOXIE_TIMEOUT:-3}
      DOXIE_DOWNLOAD_TIMEOUT: ${DOXIE_DOWNLOAD_TIMEOUT:-120}
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl jq
        cp /doxie-client.sh /usr/local/bin/doxie-client
        chmod +x /usr/local/bin/doxie-client
        exec /usr/local/bin/doxie-client

  backup:
    image: alpine:3.22
    container_name: paperless-backup
    restart: unless-stopped
    depends_on:
      - webserver
    ports:
      - "1337:1337"
    volumes:
      - /media/nextcdata/paperless/export:/export:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backup.sh:/backup.sh:ro
      - ./health-server.sh:/health-server.sh:ro
      - ./secrets/borg_ssh_key:/root/.ssh/id_borg:ro
    environment:
      TZ: Europe/Berlin
      EXPORT_CONTAINER: paperless-webserver
      HEALTH_DIR: /health
      BORG_REPO: ${BORG_REPO}
      BORG_PASSPHRASE: ${BORG_PASSPHRASE}
      BORG_RSH: ssh -i /root/.ssh/id_borg -p 23 -o StrictHostKeyChecking=accept-new
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache borgbackup docker-cli openssh-client tzdata
        # Scripts are mounted :ro, so copy them to writable locations first.
        cp /backup.sh /usr/local/bin/backup
        cp /health-server.sh /usr/local/bin/health
        chmod +x /usr/local/bin/backup
        chmod +x /usr/local/bin/health
        mkdir -p /health
        echo '0 3 * * * /usr/local/bin/backup >> /proc/1/fd/1 2>&1' > /etc/crontabs/root
        nc -lk -p 1337 -e /usr/local/bin/health &
        crond -f -l 2

networks:
  default: {}
  postgres_net:
    external: true

volumes:
  redisdata:
